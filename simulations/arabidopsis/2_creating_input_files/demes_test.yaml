description: Single-population two-epoch demography.
time_units: generations

demes:
- name: deme0
  description: Deme 0
  epochs:
    - start_size: 2
      end_time: 0
- name: deme1
  description: Deme 1
  epochs:
    - start_size: 4
      end_time: 0
- name: deme2
  description: Deme 2
  epochs:
    - start_size: 6
      end_time: 0
- name: deme3
  description: Deme 3
  epochs:
    - start_size: 8
      end_time: 0
- name: deme4
  description: Deme 4
  epochs:
    - start_size: 10
      end_time: 0

migrations:
- {source: deme0, dest: deme1, rate: 0.001, start_time: .inf, end_time: 0}
- {source: deme1, dest: deme0, rate: 0.001, start_time: .inf, end_time: 0}
- {source: deme1, dest: deme2, rate: 0.001, start_time: .inf, end_time: 0}
- {source: deme2, dest: deme1, rate: 0.001, start_time: .inf, end_time: 0}
- {source: deme2, dest: deme3, rate: 0.001, start_time: .inf, end_time: 0}
- {source: deme3, dest: deme2, rate: 0.001, start_time: .inf, end_time: 0}
- {source: deme3, dest: deme4, rate: 0.001, start_time: .inf, end_time: 0}
- {source: deme4, dest: deme3, rate: 0.001, start_time: .inf, end_time: 0}


